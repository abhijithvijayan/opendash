# Checks every push to main and every pull request: analyzer, the Dart
# tests, the Kotlin unit tests, and a debug build. No secrets are used
# here, so a pull request from a fork runs it safely.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          # Without it every run fetches the whole Gradle/Kotlin set from
          # Maven Central, which answers a busy runner with 429.
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the runner's debug key: for trying a change, never for
      # installing over a release.
      - run: flutter build apk --debug

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendash-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
