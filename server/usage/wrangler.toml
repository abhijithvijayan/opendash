name = "opendash-usage"
main = "src/index.js"
compatibility_date = "2025-11-01"

[[d1_databases]]
binding = "DB"
database_name = "opendash-usage"
database_id = "561c5fa8-def8-4c57-afd6-45a1ef737c10"

# At most 5 pings a minute from one address. The limiter keys on the
# address in memory at Cloudflare's edge; nothing is stored.
[[ratelimits]]
name = "PING_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
