name: opendash
description: A custom instrument cluster for Ola electric scooters.
publish_to: 'none'
version: 0.3.5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  grpc: ^5.2.0
  shared_preferences: ^2.5.6

  material_ui: ^1.11.0
  jni: ^1.2.0
  meta: ^1.19.0
  qr: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4
  jnigen: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/diagnostics/fault_codes.json
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
